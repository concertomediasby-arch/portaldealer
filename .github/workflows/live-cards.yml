# Kartu pratinjau WA per berita & per mobil Galeri (Tahap 5 C, 4 Nov 2026) — lihat tools/gen-live-cards.js
# Tiap ±15 menit: baca berita & mobil Galeri yang sudah tayang (data publik), buat kartu yang baru/berubah, commit ke main.
# Tahap 8 B: juga kartu per mobil (/m/) & per partner (/pp/), salinan data tools/data/*.json, lalu halaman Google
# (tools/gen-seo-pages.js: /mobil/, /partner/, /brand/, /kategori/, /produk/, sitemap.xml).
name: Kartu WA News & Galeri
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Tahap 2 hemat kuota (8 Nov 2026): salin media publik Galeri/News/Acara/Academy dari Supabase Storage ke media/ (tools/mirror-media.js)
      - name: Cek media
        id: med
        continue-on-error: true
        run: node tools/mirror-media.js --check
      - name: Pasang ffmpeg
        if: steps.med.outputs.media == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Salin media
        if: steps.med.outputs.media == 'true'
        continue-on-error: true
        run: node tools/mirror-media.js
      - name: Cek perubahan
        id: chk
        run: node tools/gen-live-cards.js --check
      - name: Pasang browser & ffmpeg
        if: steps.chk.outputs.changed == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-color-emoji
      - name: Buat kartu
        if: steps.chk.outputs.changed == 'true'
        run: node tools/gen-live-cards.js
      - name: Halaman Google
        if: steps.chk.outputs.changed == 'true'
        run: node tools/gen-seo-pages.js
      - name: Commit
        if: steps.chk.outputs.changed == 'true' || steps.med.outputs.media == 'true'
        run: |
          git config user.name "CAI Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Hanya path yang ada (di disk atau di git) — folder yang belum pernah dibuat / sudah dihapus
          # (mis. e/ sebelum acara pertama, mobil/ & hall-of-fame/ saat disembunyikan) dulu membuat git add gagal.
          for p in media n g m pp e share/live.json share/img tools/data mobil partner brand kategori produk academy hall-of-fame sitemap.xml; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Kartu WA, media & halaman Google diperbarui otomatis"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
